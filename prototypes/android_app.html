<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OmSuite - Android</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000000; /* AMOLED Dark */
            color: #e4e4e7;
            -webkit-tap-highlight-color: transparent;
        }
        .surface { background-color: #09090b; border: 1px solid #27272a; }
        .fab { background-color: #10b981; color: white; }
    </style>
</head>
<body class="h-screen flex flex-col font-sans antialiased overflow-hidden">
    <header class="p-4 surface border-b border-zinc-800 flex justify-between items-center">
        <h1 class="text-xl font-bold text-emerald-500">OmSuite</h1>
        <button class="p-2 rounded-full surface">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </button>
    </header>

    <main class="flex-1 overflow-y-auto p-4 space-y-4 pb-24">
        <h2 class="text-lg font-semibold mb-2">Recent Files</h2>
        <div class="surface p-4 rounded-xl flex items-center justify-between">
            <div>
                <h3 class="font-medium">Project_Brief.docx</h3>
                <p class="text-xs opacity-70">Local Storage • 2 mins ago</p>
            </div>
        </div>
        <div class="surface p-4 rounded-xl flex items-center justify-between">
            <div>
                <h3 class="font-medium">Financial_Q3.xlsx</h3>
                <p class="text-xs opacity-70">Downloads • 1 hour ago</p>
            </div>
        </div>
    </main>

    <button class="fab fixed bottom-20 right-6 w-14 h-14 rounded-xl shadow-lg flex items-center justify-center hover:bg-emerald-600 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    </button>

    <nav class="surface border-t border-zinc-800 p-3 flex justify-around items-center fixed bottom-0 w-full pb-safe">
        <div class="flex flex-col items-center text-emerald-500">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[10px]">Home</span>
        </div>
        <div class="flex flex-col items-center opacity-60">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
            <span class="text-[10px]">Files</span>
        </div>
        <div class="flex flex-col items-center opacity-60">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <span class="text-[10px]">Settings</span>
        </div>
    </nav>
</body>
</html>

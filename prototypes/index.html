<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0">
    <title>OmSuite - Windows Desktop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-window: #000000;
            --bg-surface: #09090b;
            --border-color: #27272a;
            --text-main: #e4e4e7;
            --accent: #10b981;
        }
        [data-theme="light"] {
            --bg-window: #f4f4f5;
            --bg-surface: #ffffff;
            --border-color: #e4e4e7;
            --text-main: #18181b;
        }
        [data-theme="green"] {
            --bg-window: #064e3b;
            --bg-surface: #065f46;
            --border-color: #047857;
            --text-main: #ecfdf5;
            --accent: #34d399;
        }
        body {
            background-color: var(--bg-window);
            color: var(--text-main);
            width: 1280px;
            margin: 0 auto;
            overflow-x: hidden;
        }
        .surface { background-color: var(--bg-surface); border: 1px solid var(--border-color); }
    </style>
</head>
<body class="h-screen flex font-sans antialiased">
    <aside class="w-64 surface h-full flex flex-col p-4">
        <h1 class="text-2xl font-bold mb-8 text-[var(--accent)]">OmSuite</h1>
        <nav class="flex-1 space-y-2">
            <a href="#" class="block px-4 py-2 rounded bg-[var(--border-color)]">Home / Recent</a>
            <a href="#" class="block px-4 py-2 rounded hover:bg-[var(--border-color)]">Files</a>
            <a href="#" class="block px-4 py-2 rounded hover:bg-[var(--border-color)]">Writer</a>
            <a href="#" class="block px-4 py-2 rounded hover:bg-[var(--border-color)]">Sheets</a>
            <a href="#" class="block px-4 py-2 rounded hover:bg-[var(--border-color)]">Settings</a>
        </nav>
        <div class="mt-auto space-y-2">
            <p class="text-sm opacity-70 mb-2">Theme</p>
            <div class="flex gap-2">
                <button onclick="setTheme('dark')" class="p-2 text-xs surface rounded">Dark</button>
                <button onclick="setTheme('light')" class="p-2 text-xs surface rounded">Light</button>
                <button onclick="setTheme('green')" class="p-2 text-xs surface rounded">Green</button>
            </div>
        </div>
    </aside>
    <main class="flex-1 p-8 h-full overflow-y-auto">
        <h2 class="text-3xl font-semibold mb-6">Home Dashboard</h2>
        <div class="grid grid-cols-3 gap-6 mb-8">
            <div class="surface p-6 rounded-lg cursor-pointer hover:border-[var(--accent)] transition-colors">
                <h3 class="font-medium mb-2">New Document</h3>
                <p class="text-sm opacity-70">Create a local text file.</p>
            </div>
            <div class="surface p-6 rounded-lg cursor-pointer hover:border-[var(--accent)] transition-colors">
                <h3 class="font-medium mb-2">Universal File Manager</h3>
                <p class="text-sm opacity-70">Browse local storage securely.</p>
            </div>
            <div class="surface p-6 rounded-lg cursor-pointer hover:border-[var(--accent)] transition-colors">
                <h3 class="font-medium mb-2">Format Converter</h3>
                <p class="text-sm opacity-70">Convert files offline.</p>
            </div>
        </div>
    </main>
    <script>
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            try { localStorage.setItem('omsuite_theme', theme); } catch(e) {}
        }
        try {
            const saved = localStorage.getItem('omsuite_theme') || 'dark';
            setTheme(saved);
        } catch(e) { setTheme('dark'); }
    </script>
</body>
</html>

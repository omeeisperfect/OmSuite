name: Publish Android APK to release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Android CI run id that produced the debug APK artifact"
        required: true
        type: string
      tag:
        description: "Release tag to upload to"
        required: true
        default: "v0.1.0"
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK artifact from the Android CI run
        uses: actions/download-artifact@v4
        with:
          name: OmSuite-debug-apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload APK to the release
        run: |
          apk=$(ls *.apk | head -n 1)
          if [ -z "$apk" ]; then echo "No APK found in the artifact" >&2; exit 1; fi
          gh release upload "${{ inputs.tag }}" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# OmSuite — Android CI (debug build only)
#
# Builds the Android app and runs its JVM unit tests on every push and
# pull request. This workflow produces a DEBUG APK only. It never performs
# release signing: no keystore, no signing secret, and no release claim
# exists anywhere in this workflow. A release APK requires a release
# keystore held outside this repository (see docs/BUILD_STATUS.md).
#
# Why CI builds at all: the development VM has no Java/Gradle (Java is not
# installed and the Java loopback path is platform-blocked), so GitHub
# Actions is the designated Android build route (see docs/BLOCKERS.md B-1).
name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build debug APK + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK and run unit tests
        # gradlew is a bootstrap script (the stock gradle-wrapper.jar is not
        # vendored): it downloads Gradle 8.7 once and then runs the build.
        # assembleDebug uses the debug signing key generated by the Android
        # Gradle plugin; that key is NOT a release key and must never be
        # presented as one.
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmSuite-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OmSuite-android-unit-test-reports
          path: apps/android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30

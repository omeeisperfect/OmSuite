name: Publish Windows installer to release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Windows CI run id that produced the installer artifact"
        required: true
        type: string
      tag:
        description: "Release tag to upload to"
        required: true
        default: "v0.1.0"
        type: string

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact from the Windows CI run
        uses: actions/download-artifact@v4
        with:
          name: OmSuite-windows-installer-unsigned
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installer to the release
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No installer exe found in the artifact" }
          gh release upload ${{ inputs.tag }} $exe.Name --clobber --repo $env:GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
